<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ringelův statek | Ubytování Vernéřovice</title>
  <meta name="description" content="Ringelův statek ve Vernéřovicích v CHKO Broumovsko. Ubytování až pro 11 osob, oplocená zahrada, koupací sud s vířivkou." />
  
  <meta property="og:title" content="Ringelův statek | Ubytování Vernéřovice" />
  <meta property="og:description" content="Klidné ubytování pro 11 osob v srdci Broumovska. Přijeďte si odpočinout do historické chalupy s vířivkou." />
  <meta property="og:image" content="https://mpe0707.github.io/Ringeluvstatek/assets/hero.jpg" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#fbfaf7;
      --bg-alt:#f1efe8;
      --text:#1f2937;
      --muted:#5b6472;
      --brand:#2f6b4f;
      --card:#ffffff;
      --border: rgba(31,41,55,0.10);
      --shadow: 0 18px 48px rgba(0,0,0,0.18);
      --radius: 18px;
      --max: 1120px;
    }

    *{ box-sizing: border-box; }
    html{ scroll-behavior: smooth; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    img{ max-width: 100%; display:block; }
    a{ color: inherit; }

    .container{
      width: min(var(--max), calc(100% - 40px));
      margin: 0 auto;
    }

    .site-header{
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255,255,255,0.90);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner{
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap: 14px;
      padding: 14px 0;
    }
    .logo{
      font-weight: 900;
      letter-spacing: -0.01em;
    }
    .nav{
      display:flex;
      flex-wrap: wrap;
      align-items:center;
      gap: 10px;
    }
    .nav a{
      text-decoration:none;
      color: var(--muted);
      font-weight: 800;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 12px;
      white-space: nowrap;
    }
    .nav a:hover{
      background: rgba(47,107,79,0.08);
      color: var(--text);
    }
    .nav .cta{
      background: var(--brand);
      color:#fff;
    }
    .nav .cta:hover{
      background: #25573f;
      color:#fff;
    }

    /* HERO */
    .hero{
      position: relative;
      min-height: clamp(520px, 72vh, 760px);
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background: #000;
    }
    .hero-media{
      position:absolute;
      inset:0;
    }
    .hero-media img{
      width:100%;
      height:100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.02);
    }
    .hero-overlay{
      position:absolute;
      inset:0;
      background: linear-gradient(90deg,
        rgba(0,0,0,0.62) 0%,
        rgba(0,0,0,0.45) 38%,
        rgba(0,0,0,0.10) 70%,
        rgba(0,0,0,0.00) 100%);
    }
    .hero-content{
      position: relative;
      z-index: 2;
      padding: 56px 0 44px 0;
      color: #fff;
    }
    .hero h1{
      font-size: clamp(34px, 4.2vw, 60px);
      line-height: 1.05;
      margin: 0;
      letter-spacing: -0.02em;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }
    .hero .lead{
      font-size: 18px;
      color: rgba(255,255,255,0.86);
      margin: 10px 0;
      max-width: 56ch;
      text-shadow: 0 14px 30px rgba(0,0,0,0.35);
    }

    .badges{
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .badge{
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.20);
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(10px);
    }
    .badge-title{ font-size: 12px; font-weight: 900; color: rgba(255,255,255,0.82); }
    .badge-value{ font-weight: 950; margin-top: 2px; color: #fff; }

    /* Sections */
    .section{ padding: 54px 0; }
    .section.alt{
      background: var(--bg-alt);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .section h2{ margin: 0 0 12px 0; font-size: 28px; letter-spacing: -0.01em; }

    .grid-list{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      list-style:none;
      padding: 0;
      margin: 18px 0 0 0;
    }
    .grid-list li{
      background: rgba(255,255,255,0.70);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      font-weight: 800;
    }

    .cards{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 18px;
    }
    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 8px 22px rgba(31,41,55,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(31,41,55,0.12);
    }
    .price{ font-size: 22px; font-weight: 950; color: var(--brand); }

    /* Gallery */
    .gallery{
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }
    .gallery-img{
      border-radius: 16px;
      border: 1px solid var(--border);
      aspect-ratio: 1 / 1;
      object-fit: cover;
      cursor: zoom-in;
      width: 100%;
    }

    /* Map & Contact */
    .map-container {
      width: 100%;
      height: 300px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .mail-link {
      font-weight: 900;
      color: var(--brand);
      text-decoration: none;
      font-size: 1.1em;
    }
    .mail-link:hover { text-decoration: underline; }

    /* Buttons */
    .button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 900;
      text-decoration:none;
      cursor: pointer;
    }
    .button.primary{
      background: var(--brand);
      color:#fff;
      box-shadow: 0 8px 20px rgba(47,107,79,0.3);
    }
    .button.primary:hover{ background: #25573f; }

    /* Footer */
    .site-footer{
      padding: 30px 0;
      border-top: 1px solid var(--border);
      background: var(--brand);
      color: white;
    }
    .site-footer .muted { color: rgba(255,255,255,0.7); text-decoration: none; }

    /* Lightbox */
    .lightbox{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .lightbox.is-open{ display:flex; }
    .lightbox-img{ max-width: 90vw; max-height: 85vh; border-radius: 12px; }
    .lightbox-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 40px
